[build]
  command = "npm run build"
  publish = "dist"

# Redirect de servidor para o grupo do WhatsApp (destino de Meta Ads)
[[redirects]]
  from = "/grupo"
  to = "https://chat.whatsapp.com/GVO3oX3YWmlECudoef0zIK"
  status = 302
  force = true

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
